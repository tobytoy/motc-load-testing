# ──────────────────────────────────────────────────────────────────────────────
# TDX 壓測平台設定檔
# 修改此檔後，重新整理 Streamlit 頁面即可生效（無需重啟）
# ──────────────────────────────────────────────────────────────────────────────

tdx:
  base_url: "https://tdx.transportdata.tw/api/basic"
  auth_url: "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token"
  # 預設測試縣市（用於有 {City} 參數的端點）
  default_city: "Taipei"
  # 預設 TRA 車站 ID（用於臺鐵 OD 票價測試）
  default_tra_origin: "0900"    # 台北
  default_tra_dest:   "1000"    # 板橋
  # 路況預設替代道路代碼
  default_alternative: "1"      # 國道1號
  # 預設路名（用於路段編碼）
  default_road_name: "中山北路"
  # 預設 CCTV ID
  default_cctvid: "N1-N-00020-M"
  # 預設 VD ID
  default_vdid: "N1-N-00020-M"
  # 預設 ETag 門架 ID
  default_etag_id: "01F0009N"
  # 預設路段 ID
  default_section_id: "N1-N-00020-000000-001000-M"
  # 預設行政區代碼（台北市）
  default_city_code: "TPE"
  # 預設停車場 ID
  default_parking_id: "P00001"
  # 預設充電站 ID
  default_charger_id: "C00001"
  # 預設 LinkID（路段編碼）
  default_link_id: "5000001"
  # 預設路段版本（路段編碼）
  default_road_version: "20240101"
  # 預設自行車站 ID
  default_bike_station_id: "500101001"
  # 預設航班 IATA 機場代碼
  default_airport_iata: "TPE"
  # 預設航運港口代碼
  default_port_id: "TWKEL"

# ──────────────────────────────────────────────────────────────────────────────
# SLA / SLO 規格設定（依規格書 §4）
# ──────────────────────────────────────────────────────────────────────────────
sla:
  sla1:
    label: "SLA 規格 1：靜/動態資料 ≤ 20Kbit（5,000 VU / 每 5 秒 / 1 小時）"
    vus: 5000
    duration: "1h"
    sleep_sec: 5.0
    avg_rt_threshold_ms: 3000
    payload_limit_kbit: 20
    # Ramp-up 緩啟動設定（避免瞬間爆量）
    ramp_up_duration: "5m"     # 爬坡時間：5 分鐘從 0 爬到 5000 VU
    ramp_down_duration: "2m"   # 爬坡結束後緩降

  sla2:
    label: "SLA 規格 2：其它 API 服務（500 VU / 5 分鐘）"
    vus: 500
    duration: "5m"
    sleep_sec: 1.0
    avg_rt_threshold_ms: 3000
    payload_limit_kbit: null
    ramp_up_duration: "1m"
    ramp_down_duration: "30s"

# ──────────────────────────────────────────────────────────────────────────────
# 單次測試預設值
# ──────────────────────────────────────────────────────────────────────────────
single_test_defaults:
  vus: 10
  duration: "30s"
  sleep_sec: 1.0
  enable_payload_check: false
  ramp_up_duration: "10s"

